[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docking-sim"
version = "0.1.0"
description = "2D spacecraft docking lab: Gymnasium env, PPO training, replay dashboard"
requires-python = ">=3.12,<3.14"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["docking_sim*", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
