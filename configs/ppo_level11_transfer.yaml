env:
  max_steps: 1600
  dt: 0.05
  y_max: 12
  dock_speed_max: 0.08
  dock_omega_max: 0.08
  dock_angle_max_deg: 12
  fuel_capacity: 160
  randomize_start: false
  randomize_velocity: false
  second_port: true
  port2_cx: 0.0
  port2_cy: 8.05
  port2_w: 1.0
  port2_h: 0.8
  port2_approach_angle: -1.57079632679
  hold_steps: 20
  level: 11
  reward: safe_docking
  weights:
    distance: 8.0
    velocity: 0.4
    rotation: 0.35
    spin: 0.35
    fuel: 0.02
    time: 0.01
    success: 120
    berth: 40
    crash: 80
    crash_speed: 15
    gate: 2.0
    close_range: 4.0

algo:
  name: ppo
  policy: MlpPolicy
  net_arch: [64, 64]
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  normalize_obs: true

train:
  total_timesteps: 200000
  checkpoint_every: 20000
  seed: 42
  device: cpu
