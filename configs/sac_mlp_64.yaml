env:
  max_steps: 800
  dt: 0.05
  dock_speed_max: 0.35
  dock_angle_max_deg: 12
  fuel_capacity: 100
  randomize_start: false
  randomize_velocity: false
  reward: safe_docking
  weights:
    distance: 8.0
    velocity: 0.4
    rotation: 0.35
    fuel: 0.02
    time: 0.01
    success: 120
    crash: 80
    crash_speed: 15
    gate: 2.0
    close_range: 4.0

algo:
  name: sac
  policy: MlpPolicy
  net_arch: [64, 64]
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  normalize_obs: true

train:
  total_timesteps: 200000
  checkpoint_every: 20000
  seed: 42
  device: cpu
