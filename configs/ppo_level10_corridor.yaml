env:
  max_steps: 1100
  dt: 0.05
  dock_speed_max: 0.08
  dock_omega_max: 0.08
  dock_angle_max_deg: 12
  fuel_capacity: 120
  randomize_start: false
  randomize_velocity: false
  n_asteroids: 3
  asteroid_radius: 0.45
  corridor_obstacles: true
  extended_obs: true
  level: 10
  reward: safe_docking
  weights:
    distance: 8.0
    velocity: 0.4
    rotation: 0.35
    spin: 0.35
    fuel: 0.02
    time: 0.01
    success: 120
    crash: 80
    crash_speed: 15
    gate: 2.0
    close_range: 4.0

algo:
  name: ppo
  policy: MlpPolicy
  net_arch: [64, 64]
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  normalize_obs: true

train:
  total_timesteps: 200000
  checkpoint_every: 20000
  seed: 42
  device: cpu
